<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TikGrab — TikTok Downloader, No Watermark</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #000 radial-gradient(900px 500px at 15% -10%, rgba(254,44,85,.25) 0%, transparent 60%),
                radial-gradient(900px 500px at 90% -10%, rgba(37,244,238,.18) 0%, transparent 60%);
    color: #fff; min-height: 100vh; padding: 20px 14px 48px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 30px; text-align: center; letter-spacing: .01em; }
  h1 .pink { color: #FE2C55; } h1 .cyan { color: #25F4EE; }
  .sub { text-align: center; color: #ccc; font-size: 14px; margin: 6px 0 4px; }
  .note { text-align: center; color: #888; font-size: 12.5px; line-height: 1.5; margin-bottom: 18px; }
  .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 18px; padding: 18px 16px; }
  label { font-size: 13px; color: #aaa; display: block; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; background: #0d0d0d; border: 1px solid #333; border-radius: 12px;
    color: #fff; font-size: 15px; padding: 13px 12px; outline: none;
  }
  input:focus { border-color: #FE2C55; }
  #pasteBtn {
    background: #222; color: #25F4EE; border: 1px solid #333; border-radius: 12px;
    font-size: 14px; font-weight: 600; padding: 0 14px; cursor: pointer; white-space: nowrap;
  }
  #goBtn {
    width: 100%; margin-top: 12px; background: #FE2C55; color: #fff; border: none; border-radius: 12px;
    font-size: 17px; font-weight: 800; letter-spacing: .03em; padding: 15px; cursor: pointer;
  }
  #goBtn:disabled { opacity: .55; }
  #status { text-align: center; font-size: 14px; margin-top: 14px; min-height: 20px; line-height: 1.5; }
  #status.err { color: #ff6b81; }
  .spinner {
    width: 22px; height: 22px; border: 3px solid #333; border-top-color: #25F4EE;
    border-radius: 50%; margin: 0 auto; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #result { display: none; margin-top: 16px; }
  #cover { width: 100%; border-radius: 12px; display: block; background: #0d0d0d; }
  #preview { width: 100%; border-radius: 12px; margin-top: 12px; display: none; background:#000; }
  #vtitle { font-size: 15px; line-height: 1.45; margin-top: 12px; }
  #vauthor { color: #25F4EE; font-size: 14px; margin-top: 5px; }
  #vmeta { color: #888; font-size: 13px; margin-top: 3px; }
  .dl { display: block; text-align: center; text-decoration: none; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15.5px; margin-top: 10px; }
  .dl.hd { background: #FE2C55; color: #fff; font-size: 16.5px; }
  .dl.sd { background: #25F4EE; color: #000; }
  .dl.mp3 { background: #222; color: #fff; border: 1px solid #444; }
  .dl.wm { background: transparent; color: #999; border: 1px solid #333; }
  #photos { display: none; margin-top: 12px; }
  #photos img { width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  .foot { text-align: center; color: #777; font-size: 12.5px; line-height: 1.6; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="cyan">Tik</span><span class="pink">Grab</span></h1>
  <p class="sub">TikTok Downloader — No Watermark</p>
  <p class="note">You get the original quality the creator uploaded — most TikToks are 1080p max, no fake 4K upscale.</p>

  <div class="card">
    <label for="linkInput">Paste a TikTok link — any format works: full link, vm.tiktok.com, or the whole Share text</label>
    <div class="row">
      <input id="linkInput" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://www.tiktok.com/...">
      <button id="pasteBtn" type="button">Paste</button>
    </div>
    <button id="goBtn" type="button">GET VIDEO</button>
    <div id="status"></div>

    <div id="result">
      <img id="cover" alt="Video cover">
      <video id="preview" controls playsinline preload="metadata"></video>
      <div id="vtitle"></div>
      <div id="vauthor"></div>
      <div id="vmeta"></div>
      <div id="buttons"></div>
      <div id="photos"></div>
    </div>
  </div>

  <p class="foot">On iPhone, the file saves to Files — open it and tap Share → Save Video to get it in Photos.</p>
</div>

<script>
  var input = document.getElementById('linkInput');
  var goBtn = document.getElementById('goBtn');
  var pasteBtn = document.getElementById('pasteBtn');
  var statusEl = document.getElementById('status');
  var resultEl = document.getElementById('result');
  var coverEl = document.getElementById('cover');
  var previewEl = document.getElementById('preview');
  var titleEl = document.getElementById('vtitle');
  var authorEl = document.getElementById('vauthor');
  var metaEl = document.getElementById('vmeta');
  var buttonsEl = document.getElementById('buttons');
  var photosEl = document.getElementById('photos');

  function extractUrl(text) {
    if (!text) return '';
    var m = String(text).match(/https?:\/\/[^\s"'<>]+/i);
    if (m && /tiktok/i.test(m[0])) return m[0].replace(/[)\].,;!?]+$/, '');
    var bare = String(text).match(/(?:www\.|vm\.|vt\.|m\.)?tiktok\.com\/[^\s"'<>]+/i);
    if (bare) return 'https://' + bare[0].replace(/[)\].,;!?]+$/, '');
    return String(text).trim();
  }

  function setStatus(html, isErr) {
    statusEl.className = isErr ? 'err' : '';
    statusEl.textContent = '';
    if (html === 'spinner') {
      var s = document.createElement('div'); s.className = 'spinner';
      statusEl.appendChild(s);
    } else if (html) {
      statusEl.textContent = html;
    }
  }

  function dlHref(streamUrl, name) {
    return '/api/download?url=' + encodeURIComponent(streamUrl) + '&name=' + encodeURIComponent(name);
  }

  function addButton(label, cls, streamUrl, name) {
    if (!streamUrl) return;
    var a = document.createElement('a');
    a.className = 'dl ' + cls;
    a.textContent = label;
    a.href = dlHref(streamUrl, name);
    buttonsEl.appendChild(a);
  }

  function showResult(d) {
    var base = 'tikgrab-' + (String(d.id || 'video').replace(/[^0-9A-Za-z_-]/g, '')) ;
    coverEl.src = d.cover ? dlHref(d.cover, base + '-cover.jpg') + '&inline=1' : '';
    coverEl.style.display = d.cover ? 'block' : 'none';
    titleEl.textContent = d.title || '(no title)';
    var au = d.author || {};
    authorEl.textContent = (au.nickname || '') + (au.unique_id ? '  @' + au.unique_id : '');
    metaEl.textContent = d.duration ? ('Duration: ' + d.duration + 's') : '';

    buttonsEl.textContent = '';
    addButton('HD • No Watermark', 'hd', d.hdplay || d.play, base + '-HD.mp4');
    addButton('SD • No Watermark', 'sd', d.play, base + '-SD.mp4');
    addButton('MP3 Audio', 'mp3', d.music, base + '.mp3');
    addButton('With Watermark', 'wm', d.wmplay, base + '-watermark.mp4');

    var stream = d.play || d.hdplay;
    if (stream) {
      previewEl.src = '/api/download?url=' + encodeURIComponent(stream) + '&name=' + encodeURIComponent(base + '.mp4') + '&inline=1';
      previewEl.style.display = 'block';
    } else {
      previewEl.style.display = 'none';
    }

    photosEl.textContent = '';
    if (d.images && d.images.length) {
      d.images.forEach(function (imgUrl, i) {
        var im = document.createElement('img');
        im.alt = 'Photo ' + (i + 1);
        im.src = '/api/download?url=' + encodeURIComponent(imgUrl) + '&name=' + encodeURIComponent(base + '-photo' + (i + 1) + '.jpg') + '&inline=1';
        photosEl.appendChild(im);
      });
      photosEl.style.display = 'block';
    } else {
      photosEl.style.display = 'none';
    }

    resultEl.style.display = 'block';
  }

  function getVideo() {
    var clean = extractUrl(input.value);
    if (!clean || !/tiktok/i.test(clean)) {
      setStatus('Paste a TikTok link first — copy it from the Share button in TikTok.', true);
      return;
    }
    input.value = clean;
    goBtn.disabled = true;
    resultEl.style.display = 'none';
    setStatus('spinner');
    fetch('/api/resolve?url=' + encodeURIComponent(clean))
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      })
      .then(function (out) {
        goBtn.disabled = false;
        if (!out.ok) {
          setStatus('Couldn’t get that video: ' + ((out.j && out.j.error) || 'Unknown error'), true);
          return;
        }
        setStatus('');
        showResult(out.j);
      })
      .catch(function (e) {
        goBtn.disabled = false;
        setStatus('Couldn’t get that video: ' + (e && e.message ? e.message : e) + ' — check the video is public and try again.', true);
      });
  }

  goBtn.addEventListener('click', getVideo);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') getVideo(); });
  pasteBtn.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        if (t) { input.value = t; getVideo(); }
      }).catch(function () { input.focus(); });
    } else { input.focus(); }
  });
</script>
</body>
</html>
